<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffe9f2">
  <meta name="description" content="和朋友在线玩对位猜数字，支持 3、4、5 位模式。粉团子陪你猜！">
  <title>对位猜数字 · 双人在线对战</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="对位猜数字首页"><span class="brand-mark">🎲</span><span>对位猜数字</span></a>
    <div class="header-tools">
      <div class="network" id="network" aria-live="polite"><i class="network-dot"></i><span>连接中</span></div>
      <button class="icon-button" id="header-sound" aria-label="切换音效" title="音效">🔊</button>
      <button class="icon-button" id="header-rules" aria-label="查看规则" title="规则">❔</button>
    </div>
  </header>
  <div class="caption" id="caption" aria-live="polite"></div>
  <main id="app" aria-live="polite"></main>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
