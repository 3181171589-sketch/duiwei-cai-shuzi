<style>

dth:0;border:1px solid #d9e6f2;background:#f9fcff;border-radius:14px;padding:13px 15px;color:var(--ink);outline:none}.input:focus{border-color:#79b7ef;box-shadow:0 0 0 4px #65a9ed20}.code-input{font-size:18px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.btn{border:0;border-radius:14px;padding:12px 17px;min-height:46px;font-weight:850;cursor:pointer;transition:.15s}.btn:hover{filter:brightness(1.03);transform:translateY(-1px)}.btn:disabled{cursor:not-allowed;opacity:.48;transform:none}.primary{color:#fff;background:linear-gradient(115deg,#397ce8,#59a9f3);box-shadow:0 9px 20px #397ce82c}.secondary{color:#4677a5;background:#edf5fc}.danger{color:#ca5660;background:#fff0f1}.green{color:#087852;background:#e5f8f0}.wide{width:100%}.home .row .primary{flex:none}.divider{height:1px;background:var(--line);margin:22px 0}.error-box,.notice{padding:12px 14px;border-radius:14px;line-height:1.55;font-size:13px}.error-box{color:#b94150;background:#fff0f1;border:1px solid #ffe0e3;margin-top:14px}.notice{color:#587a99;background:#edf7ff}.tips{font-size:12px;line-height:1.8;color:#8ba0b5;margin-top:21px}.game-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;margin-bottom:13px}.room-meta{display:flex;align-items:center;gap:11px;min-width:0}.room-symbol{width:40px;height:40px;flex:none;border-radius:14px;background:#eaf4ff;display:grid;place-items:center}.room-code{font-size:18px;font-weight:950;letter-spacing:.1em}.subtle{font-size:12px;color:var(--muted);margin-top:4px}.head-actions{display:flex;gap:6px;flex-shrink:0}.small{font-size:12px;padding:9px 11px;min-height:38px;border-radius:11px}.statusbar{padding:13px 17px;margin-bottom:13px;display:flex;justify-content:space-between;align-items:center;gap:10px}.status-title{font-weight:950}.status-desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}.score{display:flex;align-items:center;gap:7px;border-radius:13px;padding:8px 10px;background:#f1f7ff;font-weight:900;white-space:nowrap}.score b{color:var(--blue);font-size:18px}.players{display:grid;grid-template-columns:1fr 1fr;gap:12px}.player{padding:16px;position:relative;overflow:hidden;min-width:0;transition:.2s}.player.current{border-color:#79b9f4;box-shadow:0 0 0 3px #69acec17,0 15px 35px #335b8110}.player.offline{filter:saturate(.65)}.player-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.player-name{font-weight:950;font-size:16px;overflow-wrap:anywhere}.tag{font-size:10px;font-weight:850;color:#6083a1;background:#edf5fc;border-radius:99px;padding:6px 8px;white-space:nowrap}.tag.good{color:#087852;background:#e5f8f0}.player-state{min-height:21px;margin-top:5px;font-size:12px;color:var(--muted)}.player-action{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.form-row{display:flex;gap:8px}.digit-input{font-size:20px;font-weight:900;letter-spacing:.2em;text-align:center}.form-row .btn{flex:none;padding-left:12px;padding-right:12px}.locked-note{padding:10px;border-radius:12px;background:#f3f9ff;color:#5e7e9b;font-size:12px;line-height:1.6}.mode-row{display:flex;gap:9px;margin-top:13px}.mode-choice{flex:1;border:1px solid #d9e8f5;background:#f7fbff;color:#587995;border-radius:13px;padding:12px;cursor:pointer;font-weight:900}.mode-choice.active{border-color:#6ba9ee;background:#eaf4ff;color:#286ec9}.mode-choice:disabled{cursor:default;opacity:.75}.stage,.history,.result{padding:17px;margin-top:13px}.stage-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.stage h2{font-size:18px;margin:0 0 5px}.stage p,.result p{font-size:13px;line-height:1.6;color:var(--muted);margin:0}.badge{border-radius:99px;padding:7px 10px;background:#edf6ff;color:#5280a7;font-size:11px;font-weight:900;white-space:nowrap}.dice-area{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.dice-box{text-align:center;padding:13px 9px;border:1px solid var(--line);background:#f9fcff;border-radius:16px}.die{font-size:40px;font-weight:950;color:#347de5;margin:6px 0 10px;min-height:48px}.roll .die{animation:roll .45s ease-in-out infinite alternate}@keyframes roll{to{transform:rotate(12deg) scale(1.1)}}.history-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.history h3{margin:0;font-size:16px}.history-list{display:grid;gap:8px;max-height:260px;overflow:auto}.history-item{display:grid;grid-template-columns:minmax(70px,1fr) auto auto;align-items:center;gap:9px;padding:10px 11px;border-radius:12px;background:#f6faff;font-size:12px}.guess-code{font-size:16px;font-weight:950;letter-spacing:.13em}.hit{color:#17825e;font-weight:900;white-space:nowrap}.you{font-size:10px;color:#4c8bd2;margin-left:4px}.empty{padding:16px;text-align:center;color:#93a8ba;font-size:12px}.result{border:1px solid #d9f1e6;background:linear-gradient(135deg,#f1fff8,#f8fcff)}.result h2{font-size:20px;margin:0 0 7px}.result-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.secrets{display:flex;gap:9px;flex-wrap:wrap;margin:13px 0}.secret-reveal{background:#fff;border:1px solid #e2edf6;border-radius:12px;padding:10px 12px;font-size:13px}.secret-reveal b{font-size:17px;letter-spacing:.13em;color:#347de5;margin-left:6px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:13px;color:#8ba0b5;font-size:11px}.result-modal{width:min(100%,560px);max-height:90vh;overflow:auto;margin:auto}.caption{position:fixed;z-index:65;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translate(-50%,-16px);width:max-content;max-width:92vw;padding:13px 19px;border:1px solid #ffffffd9;border-radius:17px;background:#173b61ed;color:#fff;text-align:center;font-size:clamp(15px,4vw,20px);font-weight:950;box-shadow:0 15px 40px #12334b40;opacity:0;pointer-events:none;transition:opacity .28s,transform .28s}.caption.show{opacity:1;transform:translate(-50%,0)}.modal-backdrop{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#102e4d66;padding:18px;animation:fade .15s}.modal{width:min(100%,460px);padding:23px;border-radius:23px;background:white;box-shadow:0 25px 80px #102e4d45;animation:pop .22s}.modal h2{margin:0 0 12px;font-size:22px}.modal ol{padding-left:21px;color:#55748d;line-height:1.8;font-size:14px}.modal-actions{display:flex;gap:8px;margin-top:15px}.modal-actions .btn{flex:1}@keyframes pop{from{transform:scale(.92);opacity:.5}to{transform:scale(1);opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}.shake{animation:shake .22s}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media(max-width:700px){body{padding-left:10px;padding-right:10px}.top{height:59px}.brand{font-size:14px}.brand-icon{width:34px;height:34px}.net{padding:7px 9px;font-size:11px}main{margin:13px auto 38px}.home{margin:4vh auto 0;padding:23px;border-radius:21px}.game-head{padding:12px;border-radius:18px}.head-actions{gap:4px}.head-actions .small{padding:8px 7px;font-size:10px}.room-symbol{width:35px;height:35px}.room-code{font-size:15px}.players{gap:8px}.player{padding:11px;border-radius:18px}.player-name{font-size:14px}.tag{font-size:9px;padding:5px}.player-state{font-size:10px}.form-row{display:grid;grid-template-columns:1fr}.digit-input{padding:11px 8px}.form-row .btn{width:100%;min-height:40px}.stage,.history,.result{padding:13px;border-radius:18px}.stage-head{display:block}.stage-head .badge{display:inline-block;margin-top:8px}.statusbar{padding:11px}.score{gap:4px;padding:7px}.bottom{align-items:flex-start;flex-direction:column}.history-item{grid-template-columns:minmax(52px,1fr) auto auto;gap:5px;padding:9px 7px}.history-item>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.guess-code{font-size:14px}.modal{padding:20px}.result-actions .btn{flex:1}}@media(max-width:370px){.players{grid-template-columns:1fr}.home .row{flex-direction:column}.home .row .primary{width:100%}.history-item{font-size:11px}}
</style></head><body>
<header class="top"><a class="brand" href="#"><span class="brand-icon">🎲</span><span>对位猜数字</span></a><div class="net" id="network"><i class="dot"></i><span>连接中</span></div></header><div class="caption" id="caption" aria-live="polite"></div><main id="app"></main><div id="modal-root"></div><div id="toast-root" style="position:fixed;z-index:80;left:50%;bottom:20px;transform:translateX(-50%);width:min(92vw,430px)"></div>
<script src="/socket.io/socket.io.js"></script><script>
(() => {
 const socket=io({transports:['websocket','polling'],reconnection:true}),app=document.getElementById('app'),modalRoot=document.getElementById('modal-root'),network=document.getElementById('network'),captionEl=document.getElementById('caption');
 let roomId='',token='',state=null,homeError='',joining=false,pending='',roomPrefill=new URLSearchParams(location.search).get('room')||'',autoTried=false,lastNotice='',lastCaption='',captionTimer=0,showRules=false,toastTimer=0;
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const validName=v=>v===''||([...v].length<=4&&/^[\p{Script=Han}A-Za-z0-9]+$/u.test(v));
 const currentName=()=>localStorage.getItem('duiwei-name')||'';
 const validCode=v=>/^[A-Z0-9]{4,6}$/.test(v);
 function setNetwork(v){network.className='net '+(v==='on'?'on':v==='off'?'off':'');network.querySelector('span').textContent=v==='on'?'在线':v==='off'?'重连中':'连接中'}
 function toast(message,error=false){const el=document.getElementById('toast-root');el.innerHTML=`<div class="${error?'error-box':'notice'}" style="box-shadow:0 10px 28px #23456320">${esc(message)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.innerHTML='',3000)}
 const err=r=>r?.message||'操作失败，请稍后重试';
 function link(){return `${location.origin}${location.pathname}?room=${encodeURIComponent(roomId)}`}
 async function copyLink(){try{await navigator.clipboard.writeText(link())}catch{const x=document.createElement('textarea');x.value=link();x.style='position:fixed;opacity:0';document.body.append(x);x.select();document.execCommand('copy');x.remove()}toast('链接已复制，发给好友')}
 function updateUrl(id){const u=new URL(location.href);id?u.searchParams.set('room',id):u.searchParams.delete('room');history.replaceState({},'',u)}
 function playerName(i){return state?.players?.[i]?.name||`玩家 ${i===0?'A':'B'}`}
 function renderHome(){roomId='';state=null;const saved=currentName();app.innerHTML=`<section class="card home"><span class="eyebrow">🎯 双人实时对战 · 免登录</span><h1>对位猜数字<br><span>猜中每一位</span></h1><p class="lead">和朋友分享房间链接，掷骰决定先手，轮流猜中对方设置的数字。</p><label class="section-label" for="playerName">你的昵称（可留空，使用默认昵称）</label><input id="playerName" class="input" value="${esc(saved)}" autocomplete="nickname" placeholder="1–4 个汉字、字母或数字"><div id="nameHint" class="subtle" style="min-height:20px;color:var(--red)"></div><div class="section-label">创建新对局</div><button id="createRoom" class="btn primary wide">🎲 创建房间</button><div class="divider"></div><label class="section-label" for="roomCode">加入好友的房间</label><div class="row"><input id="roomCode" class="input code-input" maxlength="6" value="${esc(roomPrefill.toUpperCase())}" placeholder="输入 4–6 位房间号" autocomplete="off"><button id="joinRoom" class="btn primary">🔗 加入</button></div>${homeError?`<div class="error-box" role="alert">${esc(homeError)}</div>`:''}<div class="tips">昵称限 1–4 个汉字、英文字母或数字，不可含空格和符号。<br>密码支持 3 位或 4 位，可重复并允许以 0 开头。判定由服务端控制。</div></section>`;
  const ni=document.getElementById('playerName'),ci=document.getElementById('roomCode'),cb=document.getElementById('createRoom'),jb=document.getElementById('joinRoom');
  function validate(){const good=validName(ni.value);document.getElementById('nameHint').textContent=good?'':'名字仅限 4 字以内，不能含特殊字符';cb.disabled=!good||!socket.connected||joining;jb.disabled=!good||!socket.connected||joining||!validCode(ci.value.trim().toUpperCase())}
  ni.addEventListener('input',validate);ci.addEventListener('input',()=>{ci.value=ci.value.replace(/[^a-z0-9]/gi,'').slice(0,6).toUpperCase();validate()});
  cb.addEventListener('click',()=>{if(!validName(ni.value))return validate();localStorage.setItem('duiwei-name',ni.value);joining=true;homeError='';validate();socket.emit('room:create',{name:ni.value},r=>{joining=false;if(!r?.ok){homeError=err(r);renderHome();return}roomId=r.roomId;token=r.token;localStorage.setItem('duiwei-token:'+roomId,token);roomPrefill=roomId;updateUrl(roomId);showRules=true})});
  jb.addEventListener('click',()=>{if(!validName(ni.value))return validate();const code=ci.value.trim().toUpperCase();if(!validCode(code)){homeError='房间号应为 4–6 位字母或数字';return renderHome()}localStorage.setItem('duiwei-name',ni.value);roomPrefill=code;homeError='';joinRoom(code,localStorage.getItem('duiwei-token:'+code)||'',ni.value)});validate()
 }
 function joinRoom(id,savedToken='',name=currentName()){if(!socket.connected||joining)return;joining=true;socket.emit('room:join',{roomId:id,token:savedToken,name},r=>{joining=false;if(!r?.ok){roomId='';token='';state=null;homeError=err(r);roomPrefill=id;updateUrl('');renderHome();return}roomId=r.roomId;token=r.token;localStorage.setItem('duiwei-token:'+roomId,token);roomPrefill=roomId;updateUrl(roomId);showRules=!state})}
 function rulesModal(){return `<div class="modal-backdrop" data-backdrop><section class="modal" role="dialog" aria-modal="true"><h2>📘 对局规则</h2><ol><li>双方各设一个 ${state?.mode||'3 或 4'} 位数字密码，可重复、可 0 开头。</li><li>掷骰比点数，点数大的一方先猜。</li><li>轮流报完整数字，只反馈「猜对 X 个」；数字和位置都对才算。</li><li>一次全部对位猜中者获胜。</li><li>败方可以发起尊严之战；双方同意后，两次内猜中则平局。</li></ol><div class="modal-actions"><button class="btn primary wide" data-close-rules>知道了，开始准备</button></div></section></div>`}
 function modeText(){return state.mode?`${state.mode} 位模式`:'等待房主选择模式'}
 function playerCard(p,i){const me=i===state.selfIndex,current=state.turnIndex===i&&['playing','dignity'].includes(state.phase),name=p?.name||`玩家 ${i?'B':'A'}`;let a='';
  if(!p)a='<div class="player-action locked-note">等待对手加入房间</div>';
  else if(state.phase==='setup'&&me){if(!state.mode)a='<div class="player-action locked-note">请房主先选择 3 位或 4 位模式。</div>';else if(p.locked)a=`<div class="player-action"><div class="locked-note">🔒 你的 ${state.mode} 位密码已锁定，等对方锁定后开始掷骰。</div><button id="unlockSecret" class="btn secondary small" style="margin-top:8px">修改我的密码</button></div>`;else a=`<div class="player-action"><form id="secretForm"><label class="section-label" style="margin-top:0" for="secretInput">设置我的 ${state.mode} 位密码</label><div class="form-row"><input id="secretInput" class="input digit-input" type="password" inputmode="numeric" autocomplete="new-password" maxlength="${state.mode}" placeholder="${'•'.repeat(state.mode)}"><button class="btn primary" type="submit" ${pending?'disabled':''}>锁定密码</button></div></form></div>`}
  else if(state.phase==='setup'&&!me)a=`<div class="player-action locked-note">${p.locked?'🔒 对方已锁定密码':'等待对方设置并锁定密码'}</div>`;
  else if(['playing','dignity'].includes(state.phase)&&me&&current&&!state.paused){const d=state.phase==='dignity';a=`<div class="player-action"><form id="guessForm"><label class="section-label" style="margin-top:0" for="guessInput">${d?`尊严之战 · 第 ${state.dignityAttempts+1} / 2 次`:`轮到你猜 · ${state.mode} 位数字`}</label><div class="form-row"><input id="guessInput" class="input digit-input" inputmode="numeric" autocomplete="off" maxlength="${state.mode}" placeholder="${'·'.repeat(state.mode)}"><button class="btn primary" type="submit" ${pending?'disabled':''}>提交猜测</button></div></form></div>`}
  else if(['playing','dignity'].includes(state.phase)&&me&&!current)a=`<div class="player-action locked-note">${state.phase==='dignity'?'等待尊严之战结果':'等待轮到你行动'}</div>`;
  else if(state.phase==='playing'&&!me)a=`<div class="player-action locked-note">${current?'🎯 轮到对方猜数字':'等待对方回合'}</div>`;
  else if(state.phase==='dignity'&&!me)a='<div class="player-action locked-note">尊严之战中，你无需猜测。</div>';
  else if(['dice','normal_finished','dignity_offer','finished'].includes(state.phase))a=`<div class="player-action locked-note">${p.locked?'🔒 密码已锁定':''}${p.dice!=null?`　🎲 点数：${p.dice}`:''}</div>`;
  return `<article class="card player ${current?'current':''} ${p&&!p.online?'offline':''}"><div class="player-top"><div class="player-name">${esc(name)}${me?' <span class="you">你</span>':''}</div><span class="tag ${p?.online?'good':''}">${!p?'空位':p.online?(i===0&&state.isHost?'房主 · 在线':'在线'):'离线'}</span></div><div class="player-state">${!p?'等待第二位玩家加入':p.locked?'密码已锁定':state.phase==='setup'?'待设置密码':''}</div>${a}</article>`
 }
 function stage(){const s=state;
  if(s.phase==='waiting')return `<section class="card stage"><h2>房间已创建，等待对手</h2><p>把链接或房间号发给好友，对方加入后即可准备。<br>房间号：<b>${esc(s.roomId)}</b> · ${s.onlineCount}/2 人在线</p></section>`;
  if(s.phase==='setup')return `<section class="card stage"><div class="stage-head"><div><h2>准备阶段 · ${esc(modeText())}</h2><p>房主选择位数后，双方各自设置密码；密码由服务端保密保存。</p></div><span class="badge">${s.players.every(p=>p?.online)?'双方就位':'等待玩家在线'}</span></div><div class="mode-row"><button class="mode-choice ${s.mode===3?'active':''}" data-mode="3" ${!s.isHost||s.mode!=null||pending||s.paused?'disabled':''}>3 位数字</button><button class="mode-choice ${s.mode===4?'active':''}" data-mode="4" ${!s.isHost||s.mode!=null||pending||s.paused?'disabled':''}>4 位数字</button></div><div class="subtle">${s.isHost?(s.mode?'本局模式已锁定；下一局可重选。':'你是房主，请选择模式。'):(s.mode?`房主已选择：${s.mode} 位模式`:'仅房主可以选择模式。')}</div></section>`;
  if(s.phase==='dice')return `<section class="card stage"><div class="stage-head"><div><h2>掷骰决定先手</h2><p>双方各掷一次，点数较大者先猜；同点时重新投掷。</p></div><span class="badge">${s.diceTie?'点数相同，再投一次':'等待双方掷骰'}</span></div><div class="dice-area">${s.players.map((p,i)=>`<div class="dice-box ${pending==='dice'&&i===s.selfIndex?'roll':''}"><div class="subtle">${esc(p?.name||`玩家 ${i?'B':'A'}`)} ${i===s.selfIndex?'· 你':''}</div><div class="die">${p?.dice==null?'⚄':p.dice}</div>${i===s.selfIndex?`<button class="btn primary" data-roll ${p?.dice!=null||pending||s.paused?'disabled':''}>${p?.dice!=null?'已掷骰':'掷骰子'}</button>`:`<div class="subtle">${p?.dice!=null?'已完成':'等待对手'}</div>`}</div>`).join('')}</div>${s.diceTie?'<div class="notice">双方点数相同，请重新掷骰。</div>':''}</section>`;
  if(s.phase==='playing')return `<section class="card stage"><div class="stage-head"><div><h2>${s.paused?'对局暂停':`轮到 ${esc(playerName(s.turnIndex))} 猜数字`}</h2><p>只反馈数字与位置全部正确的个数，不提示具体位置。</p></div><span class="badge">${esc(modeText())}</span></div>${s.paused?'<div class="notice">对手离线，对局已暂停；等待对手重连。</div>':''}</section>`;
  if(s.phase==='normal_finished')return `<div class="modal-backdrop"><section class="card result result-modal"><h2>🏆 ${esc(playerName(s.normalWinner))} 获胜！</h2><p>常规对局共猜测 <b>${s.normalGuessCount}</b> 次。败方可申请尊严之战，获胜方需同意。</p>${s.selfIndex===s.normalLoser?`<div class="result-actions"><button class="btn primary" id="offerDignity" ${s.paused||pending?'disabled':''}>发起尊严之战</button><button class="btn secondary" id="declineDignity" ${s.paused||pending?'disabled':''}>不挽回，公布数字</button></div>`:'<div class="notice">等待败方选择是否发起尊严之战。</div>'}</section></div>`;
  if(s.phase==='dignity_offer')return `<div class="modal-backdrop"><section class="card result result-modal"><h2>🤝 尊严之战申请</h2><p>${esc(playerName(s.normalLoser))} 想发起尊严之战。${s.selfIndex===s.normalWinner?'是否同意？拒绝或 30 秒未响应将维持原判并公布数字。':'等待获胜方回应。'}</p>${s.selfIndex===s.normalWinner?`<div class="result-actions"><button class="btn green" data-answer="yes" ${pending||s.paused?'disabled':''}>同意挑战</button><button class="btn secondary" data-answer="no" ${pending||s.paused?'disabled':''}>拒绝并公布数字</button></div>`:''}</section></div>`;
  if(s.phase==='dignity')return `<section class="card stage"><div class="stage-head"><div><h2>⚔️ 尊严之战</h2><p>只有败方可以猜获胜方密码，最多两次；全部对位命中则本局平局。</p></div><span class="badge">已用 ${s.dignityAttempts}/2 次</span></div></section>`;
  if(s.phase==='finished'){const tie=s.outcome==='tie';return `<div class="modal-backdrop"><section class="card result result-modal"><h2>${tie?'🤝 平局！尊严挽回到位':`🏆 ${esc(playerName(s.winner))} 获胜！`}</h2><p>${tie?'败方在尊严之战中命中全部数字，双方握手言和。':`常规获胜方：${esc(playerName(s.normalWinner))} · 常规猜测 ${s.normalGuessCount} 次。`}</p><div class="secrets">${s.players.map((p,i)=>`<div class="secret-reveal">${esc(p?.name||`玩家 ${i?'B':'A'}`)} 的密码<b>${esc(s.publicSecrets?.[i]??'—')}</b></div>`).join('')}</div><div class="result-actions"><button class="btn primary" id="rematch" ${s.players[s.selfIndex]?.rematch?'disabled':''}>${s.players[s.selfIndex]?.rematch?'已准备，等对手':'再来一局'}</button><button class="btn secondary" data-copy>复制房间链接</button><button class="btn secondary" data-home>返回首页</button></div><div class="subtle">双方都点击再来一局后，房主可重新选择模式。</div></section></div>`}
  return ''
 }
 function renderGame(){if(!state)return;const active=document.activeElement?.id,oldValue=active?document.getElementById(active)?.value:null;let turn=({waiting:'等待第二位玩家',setup:'双方准备中',dice:'掷骰决定先手',playing:state.paused?'对手离线，对局暂停':state.turnIndex===state.selfIndex?'轮到你行动':`轮到 ${playerName(state.turnIndex)} 行动`,normal_finished:'常规对局结束',dignity_offer:'等待尊严之战回应',dignity:state.paused?'尊严之战暂停':state.selfIndex===state.normalLoser?'尊严之战 · 轮到你':'尊严之战进行中',finished:state.outcome==='tie'?'本局平局':'本局已结束'})[state.phase]||'游戏进行中';
  app.innerHTML=`<div class="card game-head"><div class="room-meta"><span class="room-symbol">🎲</span><div><div class="room-code">房间 ${esc(state.roomId)}</div><div class="subtle">${esc(modeText())} · ${state.onlineCount}/2 人在线</div></div></div><div class="head-actions"><button class="btn secondary small" id="openRules">规则</button><button class="btn secondary small" data-copy>复制链接</button><button class="btn danger small" data-home>退出</button></div></div><div class="card statusbar"><div><div class="status-title">${esc(turn)}</div><div class="status-desc">${state.paused?'网络断线，对局暂停，重连后继续。':'只统计数字与位置全部正确的个数。'}</div></div><div class="score"><span>比分</span><b>${state.scores?.[0]??0}</b><span>:</span><b>${state.scores?.[1]??0}</b></div></div><div class="players">${state.players.map((p,i)=>playerCard(p,i)).join('')}</div>${stage()}<section class="card history"><div class="history-head"><h3>对局记录</h3><span class="subtle">${state.history.length} 次猜测</span></div><div class="history-list">${state.history.length?[...state.history].reverse().map(x=>`<div class="history-item"><span>${esc(x.name||state.players[x.playerIndex]?.name||'玩家')} ${x.playerIndex===state.selfIndex?'<span class="you">你</span>':''}${x.kind==='dignity'?'<span class="you">尊严战</span>':''}</span><span class="guess-code">${esc(x.guess)}</span><span class="hit">猜对 ${x.hits} 个</span></div>`).join(''):'<div class="empty">对局开始后，猜测记录会显示在这里</div>'}</div></section><div class="bottom"><span>🔐 密码、命中数、回合和胜负由服务端统一判定</span><button class="btn secondary small" data-copy>分享房间</button></div>`;
  app.querySelectorAll('[data-copy]').forEach(x=>x.addEventListener('click',copyLink));app.querySelectorAll('[data-home]').forEach(x=>x.addEventListener('click',leaveRoom));
  document.getElementById('openRules')?.addEventListener('click',()=>{showRules=true;renderGame()});
  app.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>action('mode',ack=>socket.emit('mode:set',{mode:Number(b.dataset.mode)},ack))));
  const secret=document.getElementById('secretInput');secret?.addEventListener('input',()=>secret.value=secret.value.replace(/\D/g,'').slice(0,state.mode));
  document.getElementById('secretForm')?.addEventListener('submit',e=>{e.preventDefault();if(!new RegExp(`^\\d{${state.mode}}$`).test(secret.value))return invalid(secret,`请输入完整的 ${state.mode} 位数字`);action('secret',ack=>socket.emit('secret:set',{secret:secret.value},ack))});
  document.getElementById('unlockSecret')?.addEventListener('click',()=>action('secret',ack=>socket.emit('secret:unlock',{},ack)));
  app.querySelectorAll('[data-roll]').forEach(b=>b.addEventListener('click',()=>action('dice',ack=>socket.emit('dice:roll',{},ack))));
  const guess=document.getElementById('guessInput');guess?.addEventListener('input',()=>guess.value=guess.value.replace(/\D/g,'').slice(0,state.mode));
  document.getElementById('guessForm')?.addEventListener('submit',e=>{e.preventDefault();if(!new RegExp(`^\\d{${state.mode}}$`).test(guess.value))return invalid(guess,`请输入完整的 ${state.mode} 位数字`);const ev=state.phase==='dignity'?'dignity:submit':'guess:submit';action('guess',ack=>socket.emit(ev,{guess:guess.value,requestId:ev==='dignity:submit'?crypto.randomUUID():undefined},ack))});
  document.getElementById('offerDignity')?.addEventListener('click',()=>action('dignity',ack=>socket.emit('dignity:offer',{},ack)));
  document.getElementById('declineDignity')?.addEventListener('click',()=>action('dignity',ack=>socket.emit('match:decline',{},ack)));
  app.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>action('dignity',ack=>socket.emit('dignity:respond',{accept:b.dataset.answer==='yes'},ack))));
  document.getElementById('rematch')?.addEventListener('click',()=>action('rematch',ack=>socket.emit('match:rematch',{},ack)));
  if(active&&oldValue!=null){const el=document.getElementById(active);if(el)el.value=oldValue}
  modalRoot.innerHTML=showRules?rulesModal():'';modalRoot.querySelector('[data-close-rules]')?.addEventListener('click',()=>{showRules=false;modalRoot.innerHTML=''});modalRoot.querySelector('[data-backdrop]')?.addEventListener('click',e=>{if(e.target.matches('[data-backdrop]')){showRules=false;modalRoot.innerHTML=''}});
  if(state.caption&&state.captionId!==lastCaption){lastCaption=state.captionId;captionEl.textContent=state.caption;captionEl.classList.add('show');clearTimeout(captionTimer);if(state.phase!=='finished')captionTimer=setTimeout(()=>captionEl.classList.remove('show'),2700)}if(state.phase==='finished')captionEl.classList.add('show');else if(!state.caption)captionEl.classList.remove('show')
 }
 function invalid(el,message){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');el.focus();toast(message,true)}
 function action(key,send){if(pending)return;pending=key;renderGame();send(r=>{pending='';if(!r?.ok)toast(err(r),true);else if(r.message&&!r.message.startsWith('猜对 '))toast(r.message);renderGame()})}
 function leaveRoom(){if(!roomId)return renderHome();const old=roomId;socket.emit('room:leave',{},()=>{localStorage.removeItem('duiwei-token:'+old);roomId='';token='';state=null;homeError='';roomPrefill='';showRules=false;updateUrl('');renderHome()})}
 socket.on('connect',()=>{setNetwork('on');if(roomId)joinRoom(roomId,token||localStorage.getItem('duiwei-token:'+roomId)||'',currentName());else if(roomPrefill&&!autoTried){autoTried=true;const code=roomPrefill.toUpperCase();joinRoom(code,localStorage.getItem('duiwei-token:'+code)||'',currentName())}else if(!state)renderHome()});
 socket.on('disconnect',()=>{setNetwork('off');joining=false;if(state)renderGame();else renderHome()});socket.on('connect_error',()=>setNetwork('off'));
 socket.on('room:state',s=>{if(!roomId||s.roomId!==roomId||s.selfIndex<0)return;state=s;if(s.notice&&s.noticeId!==lastNotice){lastNotice=s.noticeId;toast(s.notice,s.notice.includes('超时')||s.notice.includes('非法'))}renderGame()});
 renderHome();
})();
</script></body></html>
